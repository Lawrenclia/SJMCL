name: Security audit

# 自动触发（push / pull_request / schedule / release）已禁用：构建与检查只在本地执行。
# 需要时可在 Actions 页面手动 Run workflow。
on:
  workflow_dispatch:

jobs:
  audit:
    name: cargo audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write # create issue
      checks: write # create check

    strategy:
      fail-fast: false
      matrix:
        path:
          - src-tauri
          - cli

    steps:
      - uses: actions/checkout@v7
      - uses: rustsec/audit-check@v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          working-directory: ${{ matrix.path }}
